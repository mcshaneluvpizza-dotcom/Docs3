<!doctype HTML>
<html>
<script>
var text
    function save() {
    text=document.getElementById("txt").value
    localStorage.text=text
    }
    function load() {
    document.getElementById("txt").value=localStorage.text

    }
    
</script>    
  <textarea id="txt" style="height:500px;width:500px"></textarea>
  <button style="width:80px;height:80px"onclick=save()>save</button>
  <button style="width:80px;height:80px" onclick=load()>load</button>
</html>
